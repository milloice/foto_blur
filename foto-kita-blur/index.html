<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Fotoblur - Hand Tracking V-Gesture Love Effect ✌️💕</title>
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

    <!-- MediaPipe Hands CDN Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/control_utils/control_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
        }

        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #0d0614;
            font-family: 'Outfit', 'Inter', sans-serif;
            color: #ffffff;
        }

        #app-container {
            position: relative;
            width: 100vw;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: radial-gradient(circle at center, #1f0a2e 0%, #08030c 100%);
        }

        /* Hidden Source Video */
        #webcam-video {
            display: none;
        }

        /* Main Canvas Render Window */
        #output-canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            transform: scaleX(-1); /* Mirror feel */
        }

        /* Glassmorphic UI Header Badge */
        .ui-header {
            position: absolute;
            top: 24px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 10;
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 12px 24px;
            background: rgba(20, 10, 30, 0.65);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1.5px solid rgba(255, 255, 255, 0.18);
            border-radius: 40px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.37);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .ui-header.active {
            background: rgba(255, 20, 120, 0.35);
            border-color: rgba(255, 105, 180, 0.6);
            box-shadow: 0 0 25px rgba(255, 20, 147, 0.5);
            transform: translateX(-50%) scale(1.05);
        }

        .status-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background-color: #aaa;
            box-shadow: 0 0 8px #aaa;
            transition: background-color 0.3s, box-shadow 0.3s;
        }

        .ui-header.active .status-dot {
            background-color: #ff2d75;
            box-shadow: 0 0 12px #ff2d75, 0 0 20px #ff2d75;
        }

        .status-text {
            font-size: 1.05rem;
            font-weight: 700;
            letter-spacing: 0.5px;
            white-space: nowrap;
            color: #ffffff;
            text-shadow: 0 2px 4px rgba(0,0,0,0.5);
        }

        /* Floating Action Controls */
        .controls-bar {
            position: absolute;
            bottom: 24px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 10;
            display: flex;
            gap: 12px;
            padding: 10px 16px;
            background: rgba(15, 8, 25, 0.7);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 30px;
        }

        .control-btn {
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 10px 16px;
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 20px;
            color: white;
            font-family: inherit;
            font-size: 0.85rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .control-btn:hover, .control-btn:active {
            background: rgba(255, 105, 180, 0.3);
            border-color: rgba(255, 105, 180, 0.6);
            transform: translateY(-2px);
        }

        #file-input {
            display: none;
        }

        /* Loading Screen overlay */
        #loader-screen {
            position: absolute;
            inset: 0;
            z-index: 50;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background: #0d0614;
            gap: 16px;
            transition: opacity 0.5s ease, visibility 0.5s ease;
        }

        .spinner {
            width: 50px;
            height: 50px;
            border: 4px solid rgba(255, 105, 180, 0.2);
            border-top: 4px solid #ff1493;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .loader-title {
            font-size: 1.2rem;
            font-weight: 700;
            color: #ff69b4;
        }

        .loader-desc {
            font-size: 0.85rem;
            color: #bbb;
        }
    </style>
</head>
<body>

    <div id="app-container">
        <!-- Hidden Video Input -->
        <video id="webcam-video" playsinline></video>

        <!-- Main Canvas -->
        <canvas id="output-canvas"></canvas>

        <!-- Top Header Status Badge -->
        <div class="ui-header" id="status-badge">
            <div class="status-dot"></div>
            <span class="status-text" id="status-text">✌️ Show V Gesture</span>
        </div>

        <!-- Bottom Controls -->
        <div class="controls-bar">
            <button class="control-btn" id="flip-cam-btn">🔄 Switch Camera</button>
            <button class="control-btn" id="upload-photo-btn">📸 Add Photo</button>
            <input type="file" id="file-input" accept="image/*">
        </div>

        <!-- Loading Screen -->
        <div id="loader-screen">
            <div class="spinner"></div>
            <div class="loader-title">Memuat AI Hand Tracking...</div>
            <div class="loader-desc">Izinkan akses kamera di HP / Browser Anda</div>
        </div>
    </div>

    <script>
        // ----------------------------------------------------
        // Web Application State & DOM Elements
        // ----------------------------------------------------
        const videoElement = document.getElementById('webcam-video');
        const canvasElement = document.getElementById('output-canvas');
        const canvasCtx = canvasElement.getContext('2d');
        const statusBadge = document.getElementById('status-badge');
        const statusText = document.getElementById('status-text');
        const loaderScreen = document.getElementById('loader-screen');
        const flipCamBtn = document.getElementById('flip-cam-btn');
        const uploadPhotoBtn = document.getElementById('upload-photo-btn');
        const fileInput = document.getElementById('file-input');

        let camera = null;
        let facingMode = 'user'; // 'user' (selfie) or 'environment' (back camera)
        let isVGestureActive = false;
        let blurFactor = 0.0; // 0.0 to 1.0 smooth transition
        let handCenterX = 0.5, handCenterY = 0.5;

        // Assets Pool (Emojis + Custom User Photos)
        const emojiPool = ['❤️', '💖', '💕', '💞', '💘', '💋', '🥰', '😍', '✨', '💝'];
        const loadedPhotoCanvas = [];
        let activeFloatingItems = [];
        let glitterParticles = [];

        // ----------------------------------------------------
        // Generate SVG Emoji Canvases for Crisp High-Res Rendering
        // ----------------------------------------------------
        const emojiCanvases = [];

        function createEmojiCanvas(char) {
            const cvs = document.createElement('canvas');
            cvs.width = 160;
            cvs.height = 160;
            const ctx = cvs.getContext('2d');
            ctx.font = '110px "Segoe UI Emoji", "Apple Color Emoji", "Noto Color Emoji", sans-serif';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText(char, 80, 85);
            return cvs;
        }

        emojiPool.forEach(char => {
            emojiCanvases.push(createEmojiCanvas(char));
        });

        // ----------------------------------------------------
        // Floating Item Engine (Emojis & Photos)
        // ----------------------------------------------------
        class FloatingItem {
            constructor(w, h, handX, handY) {
                // Combine emojis and custom uploaded photos
                const totalAssets = [...emojiCanvases, ...loadedPhotoCanvas];
                this.canvasAsset = totalAssets[Math.floor(Math.random() * totalAssets.length)];
                
                // Enlarged size: 90px to 160px
                this.size = Math.floor(Math.random() * 70) + 90;
                
                // Position near hand or screen bottom
                if (Math.random() < 0.65 && handX && handY) {
                    this.x = (1.0 - handX) * w + (Math.random() * 320 - 160);
                    this.y = handY * h + (Math.random() * 120 - 40);
                } else {
                    this.x = Math.random() * (w - this.size);
                    this.y = h + Math.random() * 50;
                }

                this.baseX = this.x;
                this.speedY = Math.random() * 8.0 + 7.0; // FAST RISING SPEED (7-15 px/frame)
                this.amplitudeX = Math.random() * 35 + 15;
                this.frequencyX = Math.random() * 0.05 + 0.03;
                this.phaseX = Math.random() * Math.PI * 2;
                this.rotation = (Math.random() - 0.5) * 0.4;
            }

            update() {
                this.y -= this.speedY;
                this.phaseX += this.frequencyX;
                this.x = this.baseX + Math.sin(this.phaseX) * this.amplitudeX;
            }

            draw(ctx) {
                ctx.save();
                ctx.translate(this.x + this.size / 2, this.y + this.size / 2);
                ctx.rotate(this.rotation);
                ctx.drawImage(this.canvasAsset, -this.size / 2, -this.size / 2, this.size, this.size);
                ctx.restore();
            }
        }

        // ----------------------------------------------------
        // Glitter Sparkle Engine
        // ----------------------------------------------------
        function initGlitter(w, h) {
            glitterParticles = [];
            const colors = ['#ffffff', '#ffb6c1', '#ffe4e1', '#ffd700', '#e6e6fa'];
            for (let i = 0; i < 70; i++) {
                glitterParticles.push({
                    x: Math.random() * w,
                    y: Math.random() * h,
                    size: Math.random() * 4 + 2,
                    color: colors[Math.floor(Math.random() * colors.length)],
                    phase: Math.random() * Math.PI * 2,
                    speed: Math.random() * 0.15 + 0.08,
                    vy: -(Math.random() * 0.8 + 0.2)
                });
            }
        }

        function drawGlitter(ctx, w, h) {
            ctx.save();
            glitterParticles.forEach(p => {
                p.phase += p.speed;
                p.y += p.vy;
                if (p.y < 0) {
                    p.y = h;
                    p.x = Math.random() * w;
                }

                const alpha = 0.3 + 0.7 * (0.5 + 0.5 * Math.sin(p.phase));
                ctx.globalAlpha = alpha;
                ctx.fillStyle = p.color;
                ctx.strokeStyle = p.color;
                ctx.lineWidth = 1.5;

                // Star sparkle cross
                ctx.beginPath();
                ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
                ctx.fill();

                ctx.beginPath();
                ctx.moveTo(p.x - p.size * 2, p.y);
                ctx.lineTo(p.x + p.size * 2, p.y);
                ctx.moveTo(p.x, p.y - p.size * 2);
                ctx.lineTo(p.x, p.y + p.size * 2);
                ctx.stroke();
            });
            ctx.restore();
        }

        // ----------------------------------------------------
        // MediaPipe Hands Landmark Processing & V-Gesture Check
        // ----------------------------------------------------
        function checkVGesture(landmarks) {
            // Index & Middle extended (y coordinates in normalized 0.0 - 1.0)
            const indexUp = landmarks[8].y < landmarks[6].y && landmarks[8].y < landmarks[5].y;
            const middleUp = landmarks[12].y < landmarks[10].y && landmarks[12].y < landmarks[9].y;

            // Ring & Pinky folded
            const ringDown = landmarks[16].y > landmarks[14].y;
            const pinkyDown = landmarks[20].y > landmarks[18].y;

            // Distance between Index & Middle tip (V spread)
            const dx = landmarks[8].x - landmarks[12].x;
            const dy = landmarks[8].y - landmarks[12].y;
            const tipDist = Math.hypot(dx, dy);

            return indexUp && middleUp && ringDown && pinkyDown && tipDist > 0.035;
        }

        function onResults(results) {
            // Hide loading screen on first successful result
            if (loaderScreen.style.opacity !== '0') {
                loaderScreen.style.opacity = '0';
                setTimeout(() => loaderScreen.style.visibility = 'hidden', 500);
            }

            const w = canvasElement.width = window.innerWidth;
            const h = canvasElement.height = window.innerHeight;

            if (glitterParticles.length === 0) {
                initGlitter(w, h);
            }

            let detectedV = false;

            if (results.multiHandLandmarks && results.multiHandLandmarks.length > 0) {
                for (const landmarks of results.multiHandLandmarks) {
                    if (checkVGesture(landmarks)) {
                        detectedV = true;
                        handCenterX = (landmarks[8].x + landmarks[12].x) / 2;
                        handCenterY = Math.min(landmarks[8].y, landmarks[12].y);
                        break;
                    }
                }
                if (!detectedV) {
                    handCenterX = results.multiHandLandmarks[0][0].x;
                    handCenterY = results.multiHandLandmarks[0][0].y;
                }
            }

            isVGestureActive = detectedV;

            // Update UI status badge
            if (isVGestureActive) {
                statusBadge.classList.add('active');
                statusText.innerText = '✌️ V GESTURE ACTIVE 💕';
            } else {
                statusBadge.classList.remove('active');
                statusText.innerText = '✌️ Show V Gesture';
            }

            // Smooth blur lerp transition (0.0 clear -> 1.0 full blur)
            const targetBlur = isVGestureActive ? 1.0 : 0.0;
            blurFactor += (targetBlur - blurFactor) * 0.25;

            // Clear Canvas
            canvasCtx.clearRect(0, 0, w, h);

            // ----------------------------------------------------
            // 1. Render Video Frame (Normal or Full Blur)
            // ----------------------------------------------------
            if (blurFactor > 0.01) {
                // Apply Full Camera Gaussian Blur
                canvasCtx.save();
                canvasCtx.filter = `blur(${Math.round(25 * blurFactor)}px) brightness(0.9)`;
                canvasCtx.drawImage(results.image, 0, 0, w, h);
                canvasCtx.restore();
            } else {
                canvasCtx.drawImage(results.image, 0, 0, w, h);
            }

            // ----------------------------------------------------
            // 2. Render Fast Flying Emojis & Photos (ONLY during V Gesture)
            // ----------------------------------------------------
            if (isVGestureActive) {
                // Rapid spawn: 3-5 items per frame
                const spawnCount = Math.floor(Math.random() * 3) + 3;
                for (let i = 0; i < spawnCount; i++) {
                    if (activeFloatingItems.length < 45) {
                        activeFloatingItems.push(new FloatingItem(w, h, handCenterX, handCenterY));
                    }
                }

                activeFloatingItems.forEach(item => {
                    item.update();
                    item.draw(canvasCtx);
                });

                // Remove offscreen items
                activeFloatingItems = activeFloatingItems.filter(item => item.y > -item.size - 20);

                // Render Glitter Sparkles
                drawGlitter(canvasCtx, w, h);
            } else {
                // Clear ALL floating items instantly when gesture stops
                activeFloatingItems = [];
            }

            // ----------------------------------------------------
            // 3. Draw 21 Landmark Hand Tracking Dots & Skeleton
            // ----------------------------------------------------
            if (results.multiHandLandmarks) {
                for (const landmarks of results.multiHandLandmarks) {
                    drawConnectors(canvasCtx, landmarks, HAND_CONNECTIONS, { color: '#00ffff', lineWidth: 3 });
                    drawLandmarks(canvasCtx, landmarks, { color: '#ff007f', fillColor: '#00ff00', lineWidth: 2, radius: 5 });
                }
            }
        }

        // ----------------------------------------------------
        // MediaPipe Hands Config
        // ----------------------------------------------------
        const hands = new Hands({
            locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`
        });

        hands.setOptions({
            maxNumHands: 2,
            modelComplexity: 1,
            minDetectionConfidence: 0.6,
            minTrackingConfidence: 0.6
        });

        hands.onResults(onResults);

        // Start Camera Stream
        function startCamera(facing) {
            if (camera) {
                camera.stop();
            }
            camera = new Camera(videoElement, {
                onFrame: async () => {
                    await hands.send({ image: videoElement });
                },
                width: 1280,
                height: 720,
                facingMode: facing
            });
            camera.start();
        }

        startCamera(facingMode);

        // ----------------------------------------------------
        // User Controls (Switch Camera & Upload Photo)
        // ----------------------------------------------------
        flipCamBtn.addEventListener('click', () => {
            facingMode = (facingMode === 'user') ? 'environment' : 'user';
            startCamera(facingMode);
        });

        uploadPhotoBtn.addEventListener('click', () => {
            fileInput.click();
        });

        fileInput.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(event) {
                    const img = new Image();
                    img.onload = function() {
                        const cvs = document.createElement('canvas');
                        cvs.width = 180;
                        cvs.height = 180;
                        const ctx = cvs.getContext('2d');

                        // Circular clip
                        ctx.beginPath();
                        ctx.arc(90, 90, 80, 0, Math.PI * 2);
                        ctx.closePath();
                        ctx.clip();

                        ctx.drawImage(img, 0, 0, 180, 180);

                        // Glowing pink border
                        ctx.lineWidth = 10;
                        ctx.strokeStyle = '#ff69b4';
                        ctx.stroke();

                        ctx.lineWidth = 4;
                        ctx.strokeStyle = '#ffd700';
                        ctx.stroke();

                        loadedPhotoCanvas.push(cvs);
                        alert('Foto kamu berhasil ditambahkan ke animasi love! 📸💕');
                    };
                    img.src = event.target.result;
                };
                reader.readAsDataURL(file);
            }
        });

        // Window Resize Handler
        window.addEventListener('resize', () => {
            canvasElement.width = window.innerWidth;
            canvasElement.height = window.innerHeight;
            initGlitter(canvasElement.width, canvasElement.height);
        });
    </script>
</body>
</html>
