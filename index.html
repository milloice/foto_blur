<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    
    <!-- PWA & Mobile Web App Standalone Meta Tags -->
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#0d0614">

    <title>Fotoblur - Hand Tracking V-Gesture Love Effect ✌️💕</title>
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

    <!-- MediaPipe Hands CDN Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/control_utils/control_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
        }

        body, html {
            width: 100vw;
            height: 100vh;
            height: 100dvh;
            overflow: hidden;
            background-color: #0d0614;
            font-family: 'Outfit', 'Inter', sans-serif;
            color: #ffffff;
        }

        #app-container {
            position: relative;
            width: 100vw;
            height: 100vh;
            height: 100dvh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: radial-gradient(circle at center, #1f0a2e 0%, #08030c 100%);
        }

        /* Hidden Source Video */
        #webcam-video {
            display: none;
        }

        /* Layer 1: Background Video Canvas (HD Native Max Scaled + Soft Blur) */
        #bg-canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            transform: scaleX(-1);
            transition: filter 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            will-change: filter;
            z-index: 1;
            image-rendering: -webkit-optimize-contrast;
            image-rendering: crisp-edges;
        }

        #bg-canvas.blurred {
            filter: blur(10px) brightness(0.92);
        }

        /* Layer 2: Foreground Overlay Canvas (Retina Ultra-HD Sharp) */
        #fg-canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            transform: scaleX(-1);
            pointer-events: none;
            z-index: 2;
            image-rendering: -webkit-optimize-contrast;
            image-rendering: crisp-edges;
        }

        /* Glassmorphic UI Header Badge */
        .ui-header {
            position: absolute;
            top: env(safe-area-inset-top, 20px);
            left: 50%;
            transform: translateX(-50%);
            z-index: 10;
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 8px 18px;
            background: rgba(20, 10, 30, 0.65);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1.5px solid rgba(255, 255, 255, 0.18);
            border-radius: 40px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.37);
            transition: all 0.3s ease;
        }

        .ui-header.active {
            background: rgba(255, 20, 120, 0.35);
            border-color: rgba(255, 105, 180, 0.6);
            box-shadow: 0 0 25px rgba(255, 20, 147, 0.5);
            transform: translateX(-50%) scale(1.05);
        }

        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background-color: #aaa;
            box-shadow: 0 0 6px #aaa;
            transition: background-color 0.3s, box-shadow 0.3s;
        }

        .ui-header.active .status-dot {
            background-color: #ff2d75;
            box-shadow: 0 0 12px #ff2d75;
        }

        .status-text {
            font-size: 0.9rem;
            font-weight: 700;
            letter-spacing: 0.5px;
            white-space: nowrap;
            color: #ffffff;
        }

        /* Floating Action Controls Bar */
        .controls-bar {
            position: absolute;
            bottom: max(16px, env(safe-area-inset-bottom, 16px));
            left: 50%;
            transform: translateX(-50%);
            z-index: 10;
            display: flex;
            gap: 8px;
            padding: 6px 12px;
            background: rgba(15, 8, 25, 0.75);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.18);
            border-radius: 30px;
            max-width: 95vw;
            transition: opacity 0.4s cubic-bezier(0.4, 0, 0.2, 1), transform 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .controls-bar.hidden-full {
            opacity: 0 !important;
            pointer-events: none !important;
            transform: translateX(-50%) translateY(30px) !important;
        }

        .control-btn {
            display: flex;
            align-items: center;
            gap: 5px;
            padding: 8px 14px;
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.22);
            border-radius: 20px;
            color: white;
            font-family: inherit;
            font-size: 0.8rem;
            font-weight: 600;
            cursor: pointer;
            white-space: nowrap;
            transition: all 0.2s ease;
        }

        .control-btn:hover, .control-btn:active {
            background: rgba(255, 105, 180, 0.35);
            border-color: rgba(255, 105, 180, 0.7);
            transform: translateY(-2px);
        }

        #file-input {
            display: none;
        }

        /* Loading Screen overlay */
        #loader-screen {
            position: absolute;
            inset: 0;
            z-index: 50;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background: #0d0614;
            gap: 16px;
            transition: opacity 0.5s ease, visibility 0.5s ease;
        }

        .spinner {
            width: 46px;
            height: 46px;
            border: 4px solid rgba(255, 105, 180, 0.2);
            border-top: 4px solid #ff1493;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .loader-title {
            font-size: 1.1rem;
            font-weight: 700;
            color: #ff69b4;
        }

        .loader-desc {
            font-size: 0.85rem;
            color: #bbb;
        }
    </style>
</head>
<body>

    <div id="app-container">
        <!-- Hidden Video Input -->
        <video id="webcam-video" playsinline></video>

        <!-- Layer 1: Background Video Only (HD Native Scaled + Soft Blur) -->
        <canvas id="bg-canvas"></canvas>

        <!-- Layer 2: Foreground Overlay (Emojis, Photos, Skeleton - ALWAYS 100% SHARP HD) -->
        <canvas id="fg-canvas"></canvas>

        <!-- Top Header Status Badge -->
        <div class="ui-header" id="status-badge">
            <div class="status-dot"></div>
            <span class="status-text" id="status-text">✌️ Show V Gesture</span>
        </div>

        <!-- Bottom Controls -->
        <div class="controls-bar" id="controls-bar">
            <button class="control-btn" id="fullscreen-btn">🔲 Fullscreen</button>
            <button class="control-btn" id="flip-cam-btn">🔄 Camera</button>
            <button class="control-btn" id="upload-photo-btn">📸 Add Photo</button>
            <input type="file" id="file-input" accept="image/*">
        </div>

        <!-- Loading Screen -->
        <div id="loader-screen">
            <div class="spinner"></div>
            <div class="loader-title">Memuat AI Hand Tracking...</div>
            <div class="loader-desc">Izinkan akses kamera di HP / Browser Anda</div>
        </div>
    </div>

    <script>
        // ----------------------------------------------------
        // Web Application State & DOM Elements
        // ----------------------------------------------------
        const videoElement = document.getElementById('webcam-video');
        const bgCanvas = document.getElementById('bg-canvas');
        const bgCtx = bgCanvas.getContext('2d');
        const fgCanvas = document.getElementById('fg-canvas');
        const fgCtx = fgCanvas.getContext('2d');

        const statusBadge = document.getElementById('status-badge');
        const statusText = document.getElementById('status-text');
        const loaderScreen = document.getElementById('loader-screen');
        const controlsBar = document.getElementById('controls-bar');
        const fullscreenBtn = document.getElementById('fullscreen-btn');
        const flipCamBtn = document.getElementById('flip-cam-btn');
        const uploadPhotoBtn = document.getElementById('upload-photo-btn');
        const fileInput = document.getElementById('file-input');

        let camera = null;
        let facingMode = 'user'; // 'user' (selfie) or 'environment' (back camera)
        let isVGestureActive = false;
        let handCenterX = 0.5, handCenterY = 0.5;

        // Assets Pool (Emojis + Custom User Photos)
        const emojiPool = ['❤️', '💖', '💕', '💞', '💘', '💋', '🥰', '😍', '✨', '💝'];
        const loadedPhotoCanvas = [];
        let activeFloatingItems = [];
        let glitterParticles = [];
        let spawnColumnIndex = 0; // Index counter for even horizontal distribution

        // Create Default Photo Avatar Canvas
        function createDefaultPhotoCanvas() {
            const cvs = document.createElement('canvas');
            cvs.width = 200;
            cvs.height = 200;
            const ctx = cvs.getContext('2d');

            ctx.beginPath();
            ctx.arc(100, 100, 88, 0, Math.PI * 2);
            ctx.fillStyle = '#ff69b4';
            ctx.fill();

            ctx.font = '100px sans-serif';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText('📸', 100, 105);

            ctx.lineWidth = 10;
            ctx.strokeStyle = '#ffd700';
            ctx.stroke();

            return cvs;
        }

        loadedPhotoCanvas.push(createDefaultPhotoCanvas());

        // ----------------------------------------------------
        // Retina High-DPI Canvas Resolution Scaler
        // ----------------------------------------------------
        function updateCanvasDimensions() {
            const dpr = Math.min(window.devicePixelRatio || 1, 2.5);
            bgCanvas.width = fgCanvas.width = Math.round(window.innerWidth * dpr);
            bgCanvas.height = fgCanvas.height = Math.round(window.innerHeight * dpr);
        }
        updateCanvasDimensions();

        // ----------------------------------------------------
        // Generate SVG Emoji Canvases for Crisp High-Res Rendering (BIGGER 200px)
        // ----------------------------------------------------
        const emojiCanvases = [];

        function createEmojiCanvas(char) {
            const cvs = document.createElement('canvas');
            cvs.width = 200;
            cvs.height = 200;
            const ctx = cvs.getContext('2d');
            ctx.font = '140px "Segoe UI Emoji", "Apple Color Emoji", "Noto Color Emoji", sans-serif';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText(char, 100, 105);
            return cvs;
        }

        emojiPool.forEach(char => {
            emojiCanvases.push(createEmojiCanvas(char));
        });

        // ----------------------------------------------------
        // Aspect-Ratio Preserving Cover Draw
        // ----------------------------------------------------
        function drawImageCover(ctx, img, w, h) {
            const imgWidth = img.videoWidth || img.width || 1920;
            const imgHeight = img.videoHeight || img.height || 1080;
            const imgRatio = imgWidth / imgHeight;
            const canvasRatio = w / h;
            let renderW, renderH, offsetX, offsetY;

            if (canvasRatio > imgRatio) {
                renderW = w;
                renderH = w / imgRatio;
                offsetX = 0;
                offsetY = (h - renderH) / 2;
            } else {
                renderW = h * imgRatio;
                renderH = h;
                offsetX = (w - renderW) / 2;
                offsetY = 0;
            }

            ctx.drawImage(img, offsetX, offsetY, renderW, renderH);
            return { offsetX, offsetY, renderW, renderH };
        }

        // ----------------------------------------------------
        // Floating Item Engine (BIGGER SIZE & 100% START FROM BOTTOM EVENLY SPACED)
        // ----------------------------------------------------
        class FloatingItem {
            constructor(w, h) {
                let selectedAsset;
                if (loadedPhotoCanvas.length > 0 && Math.random() < 0.5) {
                    selectedAsset = loadedPhotoCanvas[Math.floor(Math.random() * loadedPhotoCanvas.length)];
                } else {
                    selectedAsset = emojiCanvases[Math.floor(Math.random() * emojiCanvases.length)];
                }

                this.canvasAsset = selectedAsset;
                
                // BIGGER STICKER SIZE FOR MOBILE (h * 0.18 to h * 0.28)
                const minSz = Math.max(140, Math.floor(h * 0.18));
                const maxSz = Math.max(230, Math.floor(h * 0.28));
                this.size = Math.floor(Math.random() * (maxSz - minSz)) + minSz;
                
                // 100% START FROM THE BOTTOM OF THE SCREEN
                this.y = h + Math.random() * 60 + 10;

                // EVEN HORIZONTAL DISTRIBUTION (UNIFORM COLUMNS)
                const numCols = 5;
                const colWidth = Math.max(10, (w - this.size) / numCols);
                const col = (spawnColumnIndex++) % numCols;
                const colX = col * colWidth + Math.random() * (colWidth * 0.7);

                this.x = Math.max(10, Math.min(w - this.size - 10, colX));
                this.baseX = this.x;

                // ULTRA FAST RISING SPEED (16.0 - 28.0 px/frame)
                this.speedY = Math.random() * 12.0 + 16.0;
                this.amplitudeX = Math.random() * 35 + 20;
                this.frequencyX = Math.random() * 0.05 + 0.04;
                this.phaseX = Math.random() * Math.PI * 2;
                this.rotation = (Math.random() - 0.5) * 0.35;
            }

            update() {
                this.y -= this.speedY;
                this.phaseX += this.frequencyX;
                this.x = this.baseX + Math.sin(this.phaseX) * this.amplitudeX;
            }

            draw(ctx) {
                ctx.save();
                ctx.translate(this.x + this.size / 2, this.y + this.size / 2);
                ctx.rotate(this.rotation);
                ctx.drawImage(this.canvasAsset, -this.size / 2, -this.size / 2, this.size, this.size);
                ctx.restore();
            }
        }

        // ----------------------------------------------------
        // Glitter Sparkle Engine (Lightweight Mobile GPU)
        // ----------------------------------------------------
        function initGlitter(w, h) {
            glitterParticles = [];
            const colors = ['#ffffff', '#ffb6c1', '#ffe4e1', '#ffd700', '#e6e6fa'];
            for (let i = 0; i < 45; i++) {
                glitterParticles.push({
                    x: Math.random() * w,
                    y: Math.random() * h,
                    size: Math.random() * 3.5 + 2,
                    color: colors[Math.floor(Math.random() * colors.length)],
                    phase: Math.random() * Math.PI * 2,
                    speed: Math.random() * 0.15 + 0.08,
                    vy: -(Math.random() * 0.8 + 0.2)
                });
            }
        }

        function drawGlitter(ctx, w, h) {
            ctx.save();
            glitterParticles.forEach(p => {
                p.phase += p.speed;
                p.y += p.vy;
                if (p.y < 0) {
                    p.y = h;
                    p.x = Math.random() * w;
                }

                const alpha = 0.3 + 0.7 * (0.5 + 0.5 * Math.sin(p.phase));
                ctx.globalAlpha = alpha;
                ctx.fillStyle = p.color;
                ctx.strokeStyle = p.color;
                ctx.lineWidth = 1.4;

                ctx.beginPath();
                ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
                ctx.fill();

                ctx.beginPath();
                ctx.moveTo(p.x - p.size * 2, p.y);
                ctx.lineTo(p.x + p.size * 2, p.y);
                ctx.moveTo(p.x, p.y - p.size * 2);
                ctx.lineTo(p.x, p.y + p.size * 2);
                ctx.stroke();
            });
            ctx.restore();
        }

        // ----------------------------------------------------
        // MediaPipe Hands Landmark Processing & Fast Responsive V Check
        // ----------------------------------------------------
        function checkVGesture(landmarks) {
            const indexUp = landmarks[8].y < landmarks[6].y && landmarks[8].y < landmarks[5].y;
            const middleUp = landmarks[12].y < landmarks[10].y && landmarks[12].y < landmarks[9].y;

            const ringDown = landmarks[16].y > landmarks[14].y;
            const pinkyDown = landmarks[20].y > landmarks[18].y;

            const dx = landmarks[8].x - landmarks[12].x;
            const dy = landmarks[8].y - landmarks[12].y;
            const tipDist = Math.hypot(dx, dy);

            return indexUp && middleUp && ringDown && pinkyDown && tipDist > 0.03;
        }

        function onResults(results) {
            if (loaderScreen.style.opacity !== '0') {
                loaderScreen.style.opacity = '0';
                setTimeout(() => loaderScreen.style.visibility = 'hidden', 500);
            }

            const w = bgCanvas.width;
            const h = bgCanvas.height;

            if (glitterParticles.length === 0) {
                initGlitter(w, h);
            }

            let detectedV = false;

            if (results.multiHandLandmarks && results.multiHandLandmarks.length > 0) {
                for (const landmarks of results.multiHandLandmarks) {
                    if (checkVGesture(landmarks)) {
                        detectedV = true;
                        handCenterX = (landmarks[8].x + landmarks[12].x) / 2;
                        handCenterY = Math.min(landmarks[8].y, landmarks[12].y);
                        break;
                    }
                }
                if (!detectedV) {
                    handCenterX = results.multiHandLandmarks[0][0].x;
                    handCenterY = results.multiHandLandmarks[0][0].y;
                }
            }

            isVGestureActive = detectedV;

            if (isVGestureActive) {
                statusBadge.classList.add('active');
                statusText.innerText = '✌️ V GESTURE ACTIVE 💕';
                bgCanvas.classList.add('blurred');
            } else {
                statusBadge.classList.remove('active');
                statusText.innerText = '✌️ Show V Gesture';
                bgCanvas.classList.remove('blurred');
            }

            // Clear Both Canvases
            bgCtx.clearRect(0, 0, w, h);
            fgCtx.clearRect(0, 0, w, h);

            // 1. LAYER 1: Render Crisp HD Native Max Resolution Video Background
            drawImageCover(bgCtx, results.image, w, h);

            // 2. LAYER 2: Render Emojis, Photos, Glitter & Hand Skeleton on Foreground (100% SHARP HD)
            if (isVGestureActive) {
                const spawnCount = Math.floor(Math.random() * 2) + 2;
                for (let i = 0; i < spawnCount; i++) {
                    if (activeFloatingItems.length < 24) {
                        activeFloatingItems.push(new FloatingItem(w, h));
                    }
                }

                activeFloatingItems.forEach(item => {
                    item.update();
                    item.draw(fgCtx);
                });

                activeFloatingItems = activeFloatingItems.filter(item => item.y > -item.size - 30);
                drawGlitter(fgCtx, w, h);
            } else {
                activeFloatingItems = [];
            }

            // 3. Draw 21 Landmark Hand Tracking Skeleton & Dots on Foreground (100% SHARP HD)
            if (results.multiHandLandmarks) {
                for (const landmarks of results.multiHandLandmarks) {
                    drawConnectors(fgCtx, landmarks, HAND_CONNECTIONS, { color: '#00ffff', lineWidth: 3 });
                    drawLandmarks(fgCtx, landmarks, { color: '#ff007f', fillColor: '#00ff00', lineWidth: 2, radius: 5 });
                }
            }
        }

        // ----------------------------------------------------
        // MediaPipe Hands Config (Tuned for Fast Mobile Performance)
        // ----------------------------------------------------
        const hands = new Hands({
            locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`
        });

        hands.setOptions({
            maxNumHands: 2,
            modelComplexity: 0,
            minDetectionConfidence: 0.5,
            minTrackingConfidence: 0.5
        });

        hands.onResults(onResults);

        // Start Camera Stream with NATIVE MAX CAMERA RESOLUTION REQUEST (4K / Full HD 1080p Ideal)
        function startCamera(facing) {
            if (camera) {
                camera.stop();
            }
            camera = new Camera(videoElement, {
                onFrame: async () => {
                    await hands.send({ image: videoElement });
                },
                width: 1920,
                height: 1080,
                facingMode: facing
            });
            camera.start();
        }

        startCamera(facingMode);

        // ----------------------------------------------------
        // Fullscreen Change Event Listener (Auto Hide Controls Bar)
        // ----------------------------------------------------
        function handleFullscreenChange() {
            const isFull = !!(document.fullscreenElement || document.webkitFullscreenElement);
            if (isFull) {
                controlsBar.classList.add('hidden-full');
            } else {
                controlsBar.classList.remove('hidden-full');
            }
        }

        document.addEventListener('fullscreenchange', handleFullscreenChange);
        document.addEventListener('webkitfullscreenchange', handleFullscreenChange);

        // Tap screen anywhere in Fullscreen to toggle controls bar visibility
        document.getElementById('app-container').addEventListener('click', (e) => {
            if (document.fullscreenElement || document.webkitFullscreenElement) {
                if (!e.target.closest('.controls-bar')) {
                    controlsBar.classList.toggle('hidden-full');
                }
            }
        });

        // ----------------------------------------------------
        // User Controls (Fullscreen, Switch Camera, & Upload Photo)
        // ----------------------------------------------------
        fullscreenBtn.addEventListener('click', () => {
            const docEl = document.documentElement;
            if (!document.fullscreenElement && !document.webkitFullscreenElement) {
                if (docEl.requestFullscreen) {
                    docEl.requestFullscreen();
                } else if (docEl.webkitRequestFullscreen) {
                    docEl.webkitRequestFullscreen();
                }
            } else {
                if (document.exitFullscreen) {
                    document.exitFullscreen();
                } else if (document.webkitExitFullscreen) {
                    document.webkitExitFullscreen();
                }
            }
        });

        flipCamBtn.addEventListener('click', () => {
            facingMode = (facingMode === 'user') ? 'environment' : 'user';
            startCamera(facingMode);
        });

        uploadPhotoBtn.addEventListener('click', () => {
            fileInput.click();
        });

        fileInput.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(event) {
                    const img = new Image();
                    img.onload = function() {
                        const cvs = document.createElement('canvas');
                        cvs.width = 220;
                        cvs.height = 220;
                        const ctx = cvs.getContext('2d');

                        ctx.beginPath();
                        ctx.arc(110, 110, 95, 0, Math.PI * 2);
                        ctx.clip();

                        ctx.drawImage(img, 0, 0, 220, 220);

                        ctx.lineWidth = 12;
                        ctx.strokeStyle = '#ff69b4';
                        ctx.stroke();

                        ctx.lineWidth = 5;
                        ctx.strokeStyle = '#ffd700';
                        ctx.stroke();

                        for (let k = 0; k < 6; k++) {
                            loadedPhotoCanvas.push(cvs);
                        }
                        alert('Foto kamu berhasil ditambahkan dan akan muncul melayang di layar! 📸💕');
                    };
                    img.src = event.target.result;
                };
                reader.readAsDataURL(file);
            }
        });

        // Window Resize Handler
        window.addEventListener('resize', () => {
            updateCanvasDimensions();
            initGlitter(bgCanvas.width, bgCanvas.height);
        });
    </script>
</body>
</html>
